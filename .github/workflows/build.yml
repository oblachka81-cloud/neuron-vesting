name: Build & Test Contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Compile Tact contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Check contracts compile
        run: npm run check

      - name: Build contracts
        run: npm run build

      - name: List build artifacts
        run: ls -R build

      - name: Run tests
        run: npm run test
