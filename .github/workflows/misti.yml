name: Misti Static Analysis

on:
  workflow_dispatch:
  push:
    paths:
      - 'contracts/**'

jobs:
  misti:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Soufflé
        run: |
          sudo wget https://souffle-lang.github.io/ppa/souffle-key.public -O /usr/share/keyrings/souffle-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/souffle-archive-keyring.gpg] https://souffle-lang.github.io/ppa/ubuntu/ stable main" | sudo tee /etc/apt/sources.list.d/souffle.list
          sudo apt update
          sudo apt install -y souffle

      - name: Install Misti
        run: npm install -g @nowarp/misti

      - name: Run Misti
        run: |
          misti --all-detectors --min-severity medium contracts/ > misti-report.txt 2>&1 || true
          cat misti-report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: misti-report
          path: misti-report.txt
