name: Gen Rescue Orders
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/gen-rescue.ts'
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx tsx scripts/gen-rescue.ts
