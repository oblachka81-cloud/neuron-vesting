name: Deploy Mainnet Factory

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Deploy factory to mainnet
        env:
          MAINNET_MNEMONIC: ${{ secrets.MAINNET_MNEMONIC }}
          TONCENTER_API_KEY: ${{ secrets.TONCENTER_API_KEY }}
        run: npx tsx scripts/deploy-mainnet.ts
