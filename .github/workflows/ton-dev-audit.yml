name: TON Dev Skills Audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'contracts/**'

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install TON Dev Skills
        run: npm install -g @tesserae/ton-dev-skills

      - name: Run audit on Tact contracts
        run: |
          for f in contracts/*.tact; do
            echo "=== Auditing $f ==="
            ton-dev audit "$f" --format json --output "audit-$(basename $f).json" 2>&1 | tee -a ton-dev-report.txt || true
          done
          echo ""
          echo "=== Full report ==="
          cat ton-dev-report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: ton-dev-report
          path: ton-dev-report.txt
