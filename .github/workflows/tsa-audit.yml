name: TSA Static Analysis

on:
  workflow_dispatch:
  push:
    paths:
      - 'contracts/**'

jobs:
  tsa:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Build contracts
        run: npm run build

      - name: Install TSA
        run: |
          npm install tsa-installer
          npx tsa-installer install

      - name: Run TSA on contracts
        run: |
          TSA_JAR=$(find /home/runner/.tsa -name "tsa-cli-*.jar" | head -n 1)
          TSA_JAVA=$(find /home/runner/.tsa -path "*/bin/java" | head -n 1)

          echo "Using JAR: $TSA_JAR"
          echo "Using Java: $TSA_JAVA"
          
          echo "=== TSA Analysis started ===" > tsa-report.txt

          for f in build/*.code.boc; do
            echo "=== Analyzing $f ===" | tee -a tsa-report.txt
            "$TSA_JAVA" -Xmx6g -jar "$TSA_JAR" boc --input "$f" >> tsa-report.txt 2>&1 || echo "[ERROR] Failed or OutOfMemory on $f" | tee -a tsa-report.txt
            echo "" >> tsa-report.txt
          done

          echo "=== Analysis finished ===" | tee -a tsa-report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: tsa-report
          path: tsa-report.txt
