name: TSA Static Analysis

on:
  workflow_dispatch:
  push:
    paths:
      - 'contracts/**'

jobs:
  tsa:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Build contracts
        run: npm run build

      - name: Install TSA
        run: |
          npm install tsa-installer
          npx tsa-installer install

      - name: Run TSA on contracts
        run: |
          TSA_JAR="/home/runner/.tsa/tsa-cli-v0.5.3.jar"
          TSA_JAVA="/home/runner/.tsa/jre/jdk-17.0.20.1+1-jre/bin/java"
          for f in build/*.code.boc; do
            echo "=== Analyzing $f ==="
            "$TSA_JAVA" -jar "$TSA_JAR" boc --input "$f" 2>&1 | tee -a tsa-report.txt || true
            echo "" | tee -a tsa-report.txt
          done
          echo ""
          echo "=== Full report ==="
          cat tsa-report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: tsa-report
          path: tsa-report.txt
