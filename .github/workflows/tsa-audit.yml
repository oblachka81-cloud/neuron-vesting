name: TSA Static Analysis

on:
  workflow_dispatch:
  push:
    paths:
      - 'contracts/**'

jobs:
  tsa:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Build contracts
        run: npm run build

      - name: Install TSA
        run: |
          npm install tsa-installer
          npx tsa-installer install

      - name: Run TSA
        run: |
          tsa analyze build/ > tsa-report.txt 2>&1 || true
          cat tsa-report.txt

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: tsa-report
          path: tsa-report.txt
