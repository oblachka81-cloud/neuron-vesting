name: TSA Static Analysis

on:
  workflow_dispatch:
  push:
    paths:
      - 'contracts/**'

jobs:
  tsa:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Build contracts
        run: npm run build

      - name: Install TSA
        run: |
          npm install tsa-installer
          npx tsa-installer install

      - name: Run TSA help
        run: |
          TSA_JAR="/home/runner/.tsa/tsa-cli-v0.5.3.jar"
          TSA_JAVA="/home/runner/.tsa/jre/jdk-17.0.20.1+1-jre/bin/java"
          echo "=== --help ==="
          "$TSA_JAVA" -jar "$TSA_JAR" --help 2>&1 || true
          echo ""
          echo "=== --version ==="
          "$TSA_JAVA" -jar "$TSA_JAR" --version 2>&1 || true
