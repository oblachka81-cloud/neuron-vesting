name: Print locked dependency versions
on: workflow_dispatch
permissions:
  contents: write
jobs:
  print:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate package-lock.json
        run: npm install --package-lock-only
      - name: Print resolved versions
        run: |
          node -e "
          const l = require('./package-lock.json');
          const pkgs = ['@ton/core','@ton/ton','@ton/sandbox','@ton/crypto','@ton/test-utils','@tact-lang/compiler','tsx','bip39','ed25519-hd-key','tweetnacl','postgres','jest','ts-jest','typescript','@types/jest','@types/node'];
          for (const p of pkgs) {
            const e = l.packages && l.packages['node_modules/' + p];
            console.log(p + ' = ' + (e ? e.version : 'MISSING'));
          }"
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add package-lock.json" || echo "nothing to commit"
          git push
